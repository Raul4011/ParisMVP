name: Keep Supabase Alive

on:
  schedule:
    # Ejecutar cada 3 días a las 06:00 UTC
    - cron: "0 6 */3 * *"

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/productos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"